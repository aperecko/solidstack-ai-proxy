<div x-data="prompt" class="view-container h-full flex flex-col p-4 md:p-6 lg:p-8">
    <!-- Header -->
    <div class="flex items-center justify-between gap-4 mb-4 flex-shrink-0">
        <div class="flex items-center gap-4">
            <h1 class="text-2xl font-bold text-white tracking-tight" x-text="$store.global.t('promptGenius', 'Prompt Genius')">
                Prompt Genius
            </h1>
            <div class="flex items-center h-6 px-3 rounded-full bg-space-800/80 border border-space-border/50 shadow-sm backdrop-blur-sm">
                <span class="text-[10px] font-mono text-neon-purple uppercase tracking-wider">
                    COMPILER PARITY
                </span>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <button @click="clearAll()" class="btn btn-sm btn-ghost text-gray-400 hover:text-white font-mono text-xs">
                Clear
            </button>
            <button @click="compilePrompt()" class="btn btn-sm bg-neon-purple hover:bg-fuchsia-600 border-none text-white font-mono text-xs gap-2 shadow-[0_0_15px_rgba(168,85,247,0.4)]" :disabled="isCompiling || !roughPrompt.trim()">
                <svg x-show="!isCompiling" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                <svg x-show="isCompiling" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                <span x-text="isCompiling ? 'Compiling...' : 'Compile to Expert'">Compile</span>
            </button>
        </div>
    </div>

    <!-- Split Pane -->
    <div class="flex-1 flex flex-col md:flex-row gap-4 min-h-0 pb-16 md:pb-0">
        
        <!-- Left Pane: Rough Prompt Input -->
        <div class="flex-1 flex flex-col bg-space-900/60 border border-space-border/40 rounded-xl overflow-hidden shadow-inner">
            <div class="px-4 py-2 border-b border-space-border/40 bg-space-950/50 flex items-center justify-between flex-shrink-0">
                <span class="text-xs font-mono font-bold text-gray-400 uppercase tracking-widest">Rough Ideas</span>
                <span class="text-[10px] font-mono text-gray-500" x-text="roughPrompt.length + ' chars'">0 chars</span>
            </div>
            <textarea 
                x-model="roughPrompt"
                class="flex-1 w-full p-4 bg-transparent border-none resize-none focus:outline-none focus:ring-0 text-gray-300 font-sans text-sm custom-scrollbar"
                placeholder="Type your rough prompt idea here... e.g. 'Make a python script to resize images in a folder'"></textarea>
        </div>

        <!-- Divider Icon (Desktop only) -->
        <div class="hidden md:flex flex-col items-center justify-center flex-shrink-0">
            <div class="w-8 h-8 rounded-full bg-space-800 border border-space-border flex items-center justify-center shadow-lg relative z-10 text-gray-500">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </div>
        </div>

        <!-- Right Pane: Expert Prompt Output -->
        <div class="flex-1 flex flex-col bg-space-900/60 border border-space-border/40 rounded-xl overflow-hidden shadow-inner relative">
            <div class="px-4 py-2 border-b border-space-border/40 bg-space-950/50 flex items-center justify-between flex-shrink-0">
                <span class="text-xs font-mono font-bold text-neon-cyan uppercase tracking-widest flex items-center gap-2">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    Expert Prompt
                </span>
                
                <button @click="copyExpert()" class="text-gray-400 hover:text-white transition-colors" title="Copy to clipboard" x-show="expertPrompt">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                    </svg>
                </button>
            </div>
            
            <div class="flex-1 relative">
                <!-- Empty State -->
                <div x-show="!expertPrompt && !isCompiling" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 p-6 text-center">
                    <svg class="w-12 h-12 mb-3 text-space-border" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                    </svg>
                    <p class="text-sm">Compiled prompt will appear here.</p>
                </div>

                <!-- Textarea -->
                <textarea 
                    x-model="expertPrompt"
                    class="w-full h-full p-4 bg-transparent border-none resize-none focus:outline-none focus:ring-0 text-gray-200 font-mono text-sm custom-scrollbar"
                    readonly
                    x-show="expertPrompt || isCompiling"
                    :class="{'opacity-50': isCompiling}"
                    placeholder="Compiling..."></textarea>
            </div>
        </div>
    </div>
</div>
