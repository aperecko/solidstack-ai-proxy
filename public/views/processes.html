<div x-data="processes" class="view-container">
    <div class="flex items-center justify-between gap-4 mb-6">
        <div class="flex flex-wrap items-center gap-4">
            <h1 class="text-2xl font-bold text-white tracking-tight">Process Orchestrator</h1>
            <div class="flex items-center h-6 px-3 rounded-full bg-space-800/80 border border-space-border/50 shadow-sm backdrop-blur-sm">
                <span class="text-[10px] font-mono text-gray-400 uppercase tracking-wider">
                    Manage AI Proxies & Services
                </span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button class="btn btn-xs btn-outline border-space-border text-gray-400 hover:text-white transition-all gap-2 h-8" @click="fetchProcesses()">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                <span>Refresh</span>
            </button>
            <button class="btn bg-neon-purple hover:bg-purple-600 border-none text-white btn-xs gap-2 shadow-lg shadow-neon-purple/20 h-8">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                <span>New Process</span>
            </button>
        </div>
    </div>

    <div class="view-card !p-0">
        <table class="w-full">
            <thead>
                <tr class="bg-space-900/50 border-b border-space-border/50">
                    <th class="pl-6 py-3 text-left text-[10px] font-bold text-gray-500 uppercase tracking-wider">Status</th>
                    <th class="py-3 text-left text-[10px] font-bold text-gray-500 uppercase tracking-wider">Name</th>
                    <th class="py-3 text-left text-[10px] font-bold text-gray-500 uppercase tracking-wider">PID</th>
                    <th class="py-3 text-left text-[10px] font-bold text-gray-500 uppercase tracking-wider">Port</th>
                    <th class="py-3 pr-6 text-right text-[10px] font-bold text-gray-500 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="proc in list" :key="proc.name">
                    <tr class="border-b border-space-border/30 hover:bg-white/5 transition-colors">
                        <td class="pl-6 py-4">
                            <div class="flex items-center gap-2">
                                <div class="w-2 h-2 rounded-full" :class="proc.status === 'running' ? 'bg-neon-green shadow-[0_0_8px_rgba(34,197,94,0.6)] animate-pulse' : 'bg-red-500'"></div>
                                <span class="text-xs font-mono" :class="proc.status === 'running' ? 'text-neon-green' : 'text-red-400'" x-text="proc.status.toUpperCase()"></span>
                            </div>
                        </td>
                        <td class="py-4 font-mono text-sm text-gray-300" x-text="proc.name"></td>
                        <td class="py-4 font-mono text-xs text-gray-500" x-text="proc.pid || '-'"></td>
                        <td class="py-4 font-mono text-xs text-gray-500" x-text="proc.port || '-'"></td>
                        <td class="py-4 pr-6 text-right">
                            <button class="btn btn-xs btn-ghost" 
                                    :class="proc.status === 'running' ? 'text-red-400 hover:bg-red-500/10' : 'text-neon-green hover:bg-neon-green/10'"
                                    @click="toggleProcess(proc)"
                                    x-text="proc.status === 'running' ? 'Stop' : 'Start'">
                            </button>
                            <button class="btn btn-xs btn-ghost text-neon-cyan hover:bg-neon-cyan/10" @click="viewLogs(proc)">Logs</button>
                        </td>
                    </tr>
                </template>
                <tr x-show="list.length === 0"><td colspan="5" class="py-8 text-center text-gray-500 text-sm">No processes active</td></tr>
            </tbody>
        </table>
    </div>
</div>
