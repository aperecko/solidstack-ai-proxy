<div x-data="research" class="view-container">
    <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
        <div class="flex flex-wrap items-center gap-4">
            <h1 class="text-2xl font-bold text-white tracking-tight">Research Studio</h1>
            <div class="flex items-center h-6 px-3 rounded-full bg-space-800/80 border border-space-border/50 shadow-sm backdrop-blur-sm">
                <span class="text-[10px] font-mono text-gray-400 uppercase tracking-wider">
                    Domain: <code class="text-neon-cyan">subagents</code>
                </span>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button class="btn btn-sm bg-neon-purple hover:bg-purple-600 border-none text-white shadow-lg shadow-neon-purple/20 gap-2 font-mono text-xs cursor-pointer" @click="fetchTelemetry()" :disabled="isSyncing">
                <svg class="w-3.5 h-3.5" :class="{'animate-spin': isSyncing}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                <span x-text="isSyncing ? 'Syncing...' : 'Sync Telemetry'"></span>
            </button>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
        <!-- Subagent Telemetry Column -->
        <div class="flex flex-col gap-4 lg:col-span-2">
            <div class="flex items-center justify-between pb-2 border-b border-space-border/60">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-neon-green shadow-[0_0_8px_rgba(34,197,94,0.8)] animate-pulse"></div>
                    <h2 class="font-bold text-white text-sm font-mono uppercase tracking-wider">Active Subagents</h2>
                </div>
                <span class="px-2 py-0.5 rounded-full text-xs font-mono bg-neon-green/10 text-neon-green border border-neon-green/30 font-bold" x-text="activeSubagents.length"></span>
            </div>
            
            <div class="grid grid-cols-1 gap-4">
                <template x-for="agent in activeSubagents" :key="agent.id">
                    <div class="view-card border-l-4 p-4 bg-space-900/80 hover:bg-space-900 transition-all group"
                         :class="agent.status === 'active' ? 'border-l-neon-green' : 'border-l-amber-500'">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-mono font-bold" :class="agent.status === 'active' ? 'text-neon-green' : 'text-amber-400'" x-text="agent.id + ' - ' + agent.name"></span>
                            <span class="px-2 py-0.5 rounded text-[10px] font-mono uppercase bg-space-950 border border-space-border/60 text-gray-400" x-text="agent.source"></span>
                        </div>
                        <h3 class="text-sm font-bold text-white mb-2 leading-snug">Query</h3>
                        <p class="text-xs text-gray-400 leading-relaxed mb-3" x-text="agent.query"></p>
                        
                        <div class="bg-space-950 rounded p-2 text-[10px] font-mono text-gray-400">
                            <span class="text-white block mb-1">Latest Log:</span>
                            <span x-text="agent.logs"></span>
                        </div>

                        <div class="mt-3 pt-2 border-t border-space-border/30 flex items-center justify-between text-[10px] font-mono text-gray-500">
                            <span x-text="'Updated: ' + agent.lastUpdate"></span>
                            <span class="capitalize" :class="agent.status === 'active' ? 'text-neon-green' : 'text-amber-400'" x-text="agent.status"></span>
                        </div>
                    </div>
                </template>
                <div x-show="activeSubagents.length === 0" class="p-8 text-center bg-space-900/30 rounded-xl border border-dashed border-space-border/40 text-gray-500 font-mono text-xs">
                    No active subagents.
                </div>
            </div>
        </div>

        <!-- ABBA Links Column -->
        <div class="flex flex-col gap-4">
            <div class="flex items-center justify-between pb-2 border-b border-space-border/60">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-neon-cyan shadow-[0_0_8px_rgba(34,211,238,0.8)]"></div>
                    <h2 class="font-bold text-white text-sm font-mono uppercase tracking-wider">ABBA Terminals</h2>
                </div>
            </div>
            
            <div class="view-card bg-space-900/60 border border-space-border p-4">
                <template x-for="session in abbaSessions" :key="session.id">
                    <div class="mb-3 last:mb-0 p-3 bg-space-950 rounded border border-space-border/50 hover:border-neon-cyan/50 transition-colors cursor-pointer">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-mono font-bold text-white" x-text="session.id"></span>
                            <div class="w-2 h-2 rounded-full" :class="session.status === 'connected' ? 'bg-neon-green' : 'bg-gray-500'"></div>
                        </div>
                        <div class="flex justify-between items-center text-[10px] font-mono text-gray-500">
                            <span x-text="'Type: ' + session.type"></span>
                            <span x-text="session.lastActive"></span>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Tool JSON Inspector -->
    <div class="flex flex-col gap-4">
        <div class="flex items-center justify-between pb-2 border-b border-space-border/60">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-neon-purple shadow-[0_0_8px_rgba(168,85,247,0.8)]"></div>
                <h2 class="font-bold text-white text-sm font-mono uppercase tracking-wider">Tool Call Inspector</h2>
            </div>
        </div>

        <div class="view-card !p-0 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-space-950/60 border-b border-space-border/50 text-[10px] font-mono text-gray-400 uppercase tracking-wider">
                        <th class="pl-4 py-3">Tool</th>
                        <th class="py-3">Status</th>
                        <th class="py-3">Duration</th>
                        <th class="pr-4 py-3 text-right">Action</th>
                    </tr>
                </thead>
                <tbody class="text-xs font-mono">
                    <template x-for="call in toolCalls" :key="call.id">
                        <tr class="border-b border-space-border/30 hover:bg-white/5 transition-colors">
                            <td class="pl-4 py-3 font-bold text-neon-cyan" x-text="call.tool"></td>
                            <td class="py-3">
                                <span class="px-2 py-0.5 rounded text-[10px]" :class="call.status === 'success' ? 'bg-neon-green/10 text-neon-green border border-neon-green/30' : 'bg-red-500/10 text-red-400 border border-red-500/30'" x-text="call.status"></span>
                            </td>
                            <td class="py-3 text-gray-400" x-text="call.duration"></td>
                            <td class="pr-4 py-3 text-right">
                                <button class="btn btn-xs bg-space-950 border border-space-border/60 hover:text-white" @click="viewToolDetails(call)">Inspect</button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal for Tool Details -->
    <div x-show="selectedTool" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" style="display: none;">
        <div class="bg-space-900 border border-space-border rounded-xl shadow-2xl w-full max-w-3xl max-h-[80vh] flex flex-col" @click.away="closeToolDetails()">
            <div class="flex justify-between items-center p-4 border-b border-space-border/60">
                <h3 class="text-lg font-bold text-white tracking-tight">
                    Tool Inspector: <span class="text-neon-cyan font-mono text-sm" x-text="selectedTool?.tool"></span>
                </h3>
                <button class="text-gray-400 hover:text-white transition-colors" @click="closeToolDetails()">&times;</button>
            </div>
            
            <div class="p-4 overflow-y-auto flex-1 font-mono text-xs">
                <div class="mb-4">
                    <h4 class="text-gray-400 mb-2 uppercase text-[10px] tracking-wider">Arguments (JSON)</h4>
                    <pre class="bg-space-950 p-3 rounded border border-space-border/50 text-neon-green overflow-x-auto" x-text="formatJSON(selectedTool?.args)"></pre>
                </div>
                <div>
                    <h4 class="text-gray-400 mb-2 uppercase text-[10px] tracking-wider">Response (JSON)</h4>
                    <pre class="bg-space-950 p-3 rounded border border-space-border/50 text-gray-300 overflow-x-auto" x-text="formatJSON(selectedTool?.response)"></pre>
                </div>
            </div>
            
            <div class="p-4 border-t border-space-border/60 flex justify-end">
                <button class="btn btn-sm bg-space-800 hover:bg-space-700 text-white border-space-border" @click="closeToolDetails()">Close</button>
            </div>
        </div>
    </div>
</div>
