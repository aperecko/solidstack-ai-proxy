<div class="flex flex-col h-full bg-space-950 p-6" x-data="{
    grafanaReady: false,
    init() {
        // Give Grafana a moment to load
        setTimeout(() => { this.grafanaReady = true; }, 500);
    }
}">
    <!-- Header -->
    <div class="mb-6 flex justify-between items-end">
        <div>
            <h2 class="text-2xl font-bold font-mono tracking-tight text-white mb-2">Network Telemetry</h2>
            <p class="text-gray-400 text-sm max-w-2xl">
                Real-time observability matrix for SolidStack automation. Tracks bandwidth, latency, and drop rates across 
                <code class="text-neon-cyan bg-space-900 px-1 py-0.5 rounded">utun7</code> (WARP), 
                <code class="text-neon-purple bg-space-900 px-1 py-0.5 rounded">tailscale0</code>, and 
                <code class="text-emerald-400 bg-space-900 px-1 py-0.5 rounded">en0</code> (ISP).
            </p>
        </div>
        <div class="flex gap-2">
            <button @click="$refs.grafanaFrame.src = $refs.grafanaFrame.src" class="px-4 py-2 bg-space-800 hover:bg-space-700 text-white rounded font-mono text-xs border border-space-border transition-colors">
                Refresh Matrix
            </button>
            <a href="http://localhost:3000" target="_blank" class="px-4 py-2 bg-neon-purple hover:bg-purple-600 text-white rounded font-mono text-xs border border-purple-500 transition-colors flex items-center gap-2">
                <span>Grafana UI</span>
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
            </a>
        </div>
    </div>

    <!-- Grafana Embed -->
    <div class="flex-1 border border-space-border/50 rounded-xl overflow-hidden bg-space-900 shadow-xl relative min-h-[600px]">
        <div x-show="!grafanaReady" class="absolute inset-0 flex flex-col items-center justify-center bg-space-900 z-10">
            <div class="w-8 h-8 border-4 border-space-700 border-t-neon-purple rounded-full animate-spin mb-4"></div>
            <span class="font-mono text-xs text-gray-400">Initializing Telemetry Matrices...</span>
        </div>
        
        <iframe x-ref="grafanaFrame" 
                src="http://localhost:3000/d/1860/node-exporter-full?orgId=1&refresh=10s&kiosk=tv&theme=dark" 
                class="w-full h-full border-0"
                @load="grafanaReady = true">
        </iframe>
    </div>
</div>
