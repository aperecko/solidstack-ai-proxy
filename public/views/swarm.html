<div x-data="swarm" class="view-container p-6 h-full flex flex-col">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-6 gap-4">
        <div>
            <h1 class="text-2xl font-bold text-white tracking-tight" x-text="$store.global.t('swarmCockpit') || 'Swarm Cockpit'">Swarm Cockpit</h1>
            <p class="text-sm text-gray-400">Manage swarm grid, view 2SV backup codes, and pin personas.</p>
        </div>
        
        <div class="flex items-center gap-2 flex-wrap">
            <!-- Domain Filter -->
            <select x-model="selectedDomain" class="select select-sm select-bordered bg-space-900 border-space-border text-gray-300 font-mono text-xs">
                <template x-for="domain in domains" :key="domain">
                    <option :value="domain" x-text="domain === 'all' ? 'All Domains' : domain"></option>
                </template>
            </select>
            
            <!-- Search Filter -->
            <div class="relative">
                <input type="text" x-model="searchQuery" placeholder="Search accounts..." class="input input-sm input-bordered bg-space-900 border-space-border text-gray-300 font-mono text-xs w-40 sm:w-48 pl-8">
                <svg class="w-4 h-4 absolute left-2.5 top-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
            
            <!-- Account Count -->
            <div class="text-xs font-mono text-gray-400 bg-space-800 px-3 py-1.5 rounded border border-space-border h-8 flex items-center">
                <span x-text="filteredAccounts.length"></span> / <span x-text="accounts.length"></span>
            </div>
        </div>
    </div>
    
    <!-- Account Grid -->
    <div class="flex-1 overflow-y-auto custom-scrollbar pb-10">
        <!-- Empty State -->
        <template x-if="filteredAccounts.length === 0">
            <div class="flex flex-col items-center justify-center h-64 text-gray-500">
                <svg class="w-12 h-12 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <p>No accounts found matching your filters.</p>
            </div>
        </template>
        
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-3">
            <template x-for="acc in filteredAccounts" :key="acc.email">
                <div class="bg-space-900/60 border rounded-lg shadow-sm p-3 relative flex flex-col hover:bg-space-800 transition-all duration-200" 
                     :class="pinnedPersonas.includes(acc.email) ? 'border-neon-purple shadow-[0_0_10px_rgba(168,85,247,0.2)]' : 'border-space-border/50'">
                     
                    <!-- Pin Button -->
                    <button @click="togglePin(acc.email)" class="absolute top-2 right-2 text-gray-500 hover:text-neon-purple transition-colors z-10" :title="pinnedPersonas.includes(acc.email) ? 'Unpin Persona' : 'Pin Persona'">
                        <svg class="w-3.5 h-3.5" :class="{'fill-neon-purple text-neon-purple': pinnedPersonas.includes(acc.email)}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
                        </svg>
                    </button>
                    
                    <!-- Health Indicator -->
                    <div class="absolute top-2.5 left-2.5 w-2 h-2 rounded-full"
                         :class="acc.status === 'ok' ? 'bg-neon-green shadow-[0_0_5px_rgba(34,197,94,0.8)]' : (acc.status === 'banned' ? 'bg-red-800' : (acc.isInvalid ? 'bg-yellow-500' : 'bg-red-500'))"
                         :title="'Status: ' + (acc.status || 'unknown')">
                    </div>
                    
                    <!-- Avatar / Initial -->
                    <div class="flex justify-center mt-3 mb-2">
                        <template x-if="acc.picture">
                            <img :src="acc.picture" class="w-10 h-10 rounded-full border border-space-border object-cover">
                        </template>
                        <template x-if="!acc.picture">
                            <div class="w-10 h-10 rounded-full bg-space-950 border border-space-border flex items-center justify-center text-gray-400 font-bold font-mono text-sm">
                                <span x-text="acc.email.charAt(0).toUpperCase()"></span>
                            </div>
                        </template>
                    </div>
                    
                    <!-- Username & Domain -->
                    <div class="text-center mb-3">
                        <div class="text-[11px] font-mono font-bold text-gray-200 truncate w-full px-1" :title="acc.email" x-text="acc.email.split('@')[0]"></div>
                        <div class="text-[9px] font-mono text-gray-500 truncate w-full px-1" x-text="'@' + (acc.email.split('@')[1] || '')"></div>
                    </div>
                    
                    <!-- Details line -->
                    <div class="flex justify-between items-center text-[9px] border-t border-space-border/50 pt-2 mt-auto">
                        <span class="text-gray-500 font-bold uppercase tracking-wider" x-text="acc.type === 'apikey' ? 'API' : (acc.subscription?.tier || acc.tier || 'FREE')"></span>
                        <span class="font-mono" :class="acc.status === 'ok' ? 'text-neon-green' : 'text-yellow-500'" x-text="acc.status === 'ok' ? 'READY' : 'LIM'"></span>
                    </div>
                    
                    <!-- 2SV Actions -->
                    <div class="mt-2 flex justify-center">
                        <button class="w-full py-1 text-[9px] font-mono rounded bg-space-950 hover:bg-space-800 border border-space-border text-gray-400 hover:text-white transition-colors"
                                @click="fetchCredentials(acc.email)">
                            View 2SV/Creds
                        </button>
                    </div>
                    
                    <!-- Backup Codes Display inline -->
                    <template x-if="expandedCreds === acc.email">
                        <div class="mt-2 text-[8px] font-mono text-gray-300 bg-black/60 p-2 rounded border border-space-border/50 relative overflow-hidden">
                            <button @click="expandedCreds = null" class="absolute top-0.5 right-0.5 text-gray-500 hover:text-white">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                            
                            <div class="mb-1 text-neon-cyan font-bold">Password:</div>
                            <div class="select-all mb-2 truncate" x-text="credsData?.password || 'N/A'"></div>
                            
                            <div class="text-neon-purple font-bold mb-1">Backup Codes:</div>
                            <div class="max-h-16 overflow-y-auto custom-scrollbar">
                                <template x-if="!credsData?.backup_codes || credsData.backup_codes.length === 0">
                                    <div class="text-gray-600">No codes available</div>
                                </template>
                                <template x-for="code in (credsData?.backup_codes || [])">
                                    <div class="select-all hover:text-white transition-colors" x-text="code"></div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </div>
</div>
