<div x-data="uad" class="view-container">
    <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
        <div class="flex flex-wrap items-center gap-4">
            <h1 class="text-2xl font-bold text-white tracking-tight">Universal Action Dispatcher (UAD)</h1>
            <div class="flex items-center h-6 px-3 rounded-full bg-space-800/80 border border-space-border/50 shadow-sm backdrop-blur-sm">
                <span class="text-[10px] font-mono text-gray-400 uppercase tracking-wider">
                    Domain: <code class="text-neon-cyan">mcp (19874)</code>
                </span>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <!-- Search Input -->
            <div class="relative w-48 sm:w-64">
                <input type="text" x-model="searchQuery" placeholder="Search actions..." 
                       class="w-full h-8 bg-space-950 border border-space-border rounded-xl text-xs font-mono pl-8 pr-3 text-white focus:border-neon-cyan focus:outline-none">
                <svg class="w-3.5 h-3.5 text-gray-500 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
            </div>
            <button class="btn btn-xs btn-outline border-space-border text-gray-400 hover:text-white transition-all gap-2 h-8" @click="fetchActions()">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                <span>Refresh</span>
            </button>
        </div>
    </div>

    <!-- Category Filter Pills -->
    <div class="flex flex-wrap items-center gap-2 mb-6" x-show="categories && categories.length > 1">
        <template x-for="cat in categories" :key="cat">
            <button @click="selectedCategory = cat"
                    class="px-3 py-1 rounded-full text-xs font-mono transition-all border"
                    :class="selectedCategory === cat ? 'bg-neon-cyan/20 border-neon-cyan/50 text-neon-cyan font-bold shadow-[0_0_10px_rgba(6,182,212,0.2)]' : 'bg-space-900 border-space-border/60 text-gray-400 hover:text-white'"
                    x-text="cat.toUpperCase()">
            </button>
        </template>
    </div>

    <!-- Action Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <template x-for="action in filteredActions" :key="action.name">
            <div class="view-card flex flex-col justify-between h-full border border-space-border/60 bg-space-900/60 hover:border-neon-cyan/40 hover:bg-space-900 transition-all group">
                <div>
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="text-neon-cyan font-mono font-bold text-sm group-hover:text-white transition-colors" x-text="action.name"></h3>
                        <span class="badge badge-sm bg-space-800 text-gray-300 font-mono text-[10px] border border-space-border/50" x-text="action.ui_section || 'Core'"></span>
                    </div>
                    <p class="text-xs text-gray-400 mb-4 leading-relaxed" x-text="action.description"></p>
                </div>
                <div>
                    <div class="flex gap-1.5 flex-wrap mb-4">
                        <template x-for="tag in action.tags">
                            <span class="text-[10px] px-2 py-0.5 rounded bg-space-950 font-mono text-gray-400 border border-space-border/40" x-text="'#' + tag"></span>
                        </template>
                    </div>
                    <button class="btn btn-sm btn-outline border-neon-cyan/30 text-neon-cyan hover:bg-neon-cyan hover:text-black w-full font-mono text-xs gap-2" @click="openConfigure(action)">
                        <span>Configure & Execute</span>
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                    </button>
                </div>
            </div>
        </template>

        <template x-if="filteredActions.length === 0">
            <div class="col-span-full py-12 text-center text-gray-500 font-mono text-xs">
                No actions match your search filter.
            </div>
        </template>
    </div>

    <!-- Execution Modal -->
    <div x-show="executingAction" style="display: none;" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm transition-opacity">
        <div class="bg-space-900 border border-space-border rounded-2xl w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden animate-scale-in" @click.away="closeModal()">
            
            <div class="p-5 border-b border-space-border flex justify-between items-center bg-space-950">
                <div class="flex items-center gap-2 font-mono">
                    <span class="w-2 h-2 rounded-full bg-neon-cyan"></span>
                    <h3 class="text-base font-bold text-white" x-text="executingAction?.name"></h3>
                </div>
                <button @click="closeModal()" class="text-gray-400 hover:text-white p-1">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <div class="p-6 overflow-y-auto flex-grow custom-scrollbar">
                <p class="text-xs text-gray-300 mb-6 bg-space-950 p-3 rounded-xl border border-space-border/60" x-text="executingAction?.description"></p>

                <!-- Dynamic Form Generation based on Schema -->
                <div class="space-y-4 mb-6" x-show="executingAction?.input_schema?.properties && Object.keys(executingAction.input_schema.properties).length > 0">
                    <h4 class="text-xs font-bold text-neon-cyan uppercase font-mono tracking-wider mb-3 pb-1 border-b border-space-border/50">Configuration Parameters</h4>
                    
                    <template x-for="[key, prop] in Object.entries(executingAction?.input_schema?.properties || {})" :key="key">
                        <div class="form-control w-full">
                            <label class="label pt-0 pb-1">
                                <span class="label-text text-xs text-gray-200 font-mono font-bold" x-text="key"></span>
                                <span class="label-text-alt text-[10px] text-gray-500 font-mono" x-text="prop.type"></span>
                            </label>

                            <!-- String / Text Input -->
                            <template x-if="prop.type === 'string'">
                                <input type="text" x-model="formPayload[key]" class="input input-sm input-bordered bg-space-950 border-space-border w-full text-xs font-mono text-white focus:border-neon-cyan" :placeholder="prop.description || ''" />
                            </template>

                            <!-- Integer / Number Input -->
                            <template x-if="prop.type === 'integer' || prop.type === 'number'">
                                <input type="number" x-model="formPayload[key]" class="input input-sm input-bordered bg-space-950 border-space-border w-full text-xs font-mono text-white focus:border-neon-cyan" />
                            </template>

                            <!-- Boolean Toggle -->
                            <template x-if="prop.type === 'boolean'">
                                <label class="cursor-pointer label justify-start gap-3 py-1">
                                    <input type="checkbox" x-model="formPayload[key]" class="toggle toggle-xs toggle-primary" />
                                    <span class="text-xs text-gray-300 font-mono" x-text="prop.description || 'Enable / Disable'"></span>
                                </label>
                            </template>
                            
                            <p class="text-[10px] text-gray-500 mt-1 font-mono" x-text="prop.description"></p>
                        </div>
                    </template>
                </div>
                
                <div x-show="!executingAction?.input_schema?.properties || Object.keys(executingAction.input_schema.properties).length === 0" class="mb-6">
                    <span class="text-xs text-gray-500 font-mono italic">No input parameters required for this action.</span>
                </div>

                <!-- Output Terminal View -->
                <div x-show="executionResult" class="mt-6">
                    <div class="flex items-center justify-between mb-2">
                        <h4 class="text-xs font-bold text-gray-300 font-mono uppercase tracking-wider">Execution Output</h4>
                        <button @click="copyOutput()" type="button" class="btn btn-xs btn-ghost text-neon-cyan hover:bg-neon-cyan/10 gap-1 font-mono">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                            <span>Copy</span>
                        </button>
                    </div>
                    <pre class="bg-black border border-space-border p-4 rounded-xl text-xs font-mono text-emerald-400 whitespace-pre-wrap overflow-x-auto max-h-60 custom-scrollbar" x-text="executionResult"></pre>
                </div>
            </div>

            <div class="p-4 border-t border-space-border bg-space-950 flex justify-end gap-3 font-mono">
                <button class="btn btn-sm btn-ghost text-gray-400 hover:text-white" @click="closeModal()">Close</button>
                <button class="btn btn-sm bg-neon-cyan text-black hover:bg-white border-none gap-2 font-bold" @click="runExecution()" :disabled="isRunning">
                    <template x-if="isRunning">
                        <svg class="animate-spin -ml-1 mr-1 h-3.5 w-3.5 text-black" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    </template>
                    <span x-text="isRunning ? 'Dispatching...' : 'Dispatch Action'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
