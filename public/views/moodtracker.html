<div x-data="moodTracker" class="view-container px-6 py-6">
    <!-- Header -->
    <div class="flex items-center justify-between gap-4 mb-6">
        <div class="flex flex-wrap items-center gap-4">
            <h1 class="text-2xl font-bold text-white tracking-tight flex items-center gap-3">
                <span class="p-2 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </span>
                Mood Tracker
            </h1>
            <div class="flex items-center h-6 px-3 rounded-full bg-space-800/80 border border-space-border/50 shadow-sm backdrop-blur-sm">
                <span class="text-[10px] font-mono text-gray-400 uppercase tracking-wider">
                    Block Calendar · Depressed Vibe 0–100
                </span>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button @click="fetchCalendar()" :disabled="loading"
                class="p-2 rounded-xl bg-space-900 border border-space-border text-gray-400 hover:text-white hover:border-emerald-500 transition-all disabled:opacity-50"
                title="Refresh">
                <svg class="w-4 h-4" :class="{'animate-spin text-emerald-400': loading}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Summary Stats -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
        <div class="p-4 rounded-2xl bg-space-900/70 border border-space-border/50 text-center">
            <div class="text-[10px] font-mono text-gray-500 uppercase tracking-wider mb-1">Entries</div>
            <div class="text-2xl font-bold text-white" x-text="filledCount()"></div>
        </div>
        <div class="p-4 rounded-2xl bg-space-900/70 border border-space-border/50 text-center">
            <div class="text-[10px] font-mono text-gray-500 uppercase tracking-wider mb-1">Week Avg</div>
            <div class="text-2xl font-bold" :style="avgScore() != null ? `color: ${scoreColor(avgScore())}` : ''" x-text="avgScore() != null ? avgScore() : '—'"></div>
        </div>
        <div class="p-4 rounded-2xl bg-space-900/70 border border-space-border/50 text-center">
            <div class="text-[10px] font-mono text-gray-500 uppercase tracking-wider mb-1">Today</div>
            <div class="text-2xl font-bold" :style="todayScore() != null ? `color: ${scoreColor(todayScore())}` : ''" x-text="todayScore() != null ? todayScore() : '—'"></div>
        </div>
        <div class="p-4 rounded-2xl bg-space-900/70 border border-space-border/50 text-center">
            <div class="text-[10px] font-mono text-gray-500 uppercase tracking-wider mb-1">Label</div>
            <div class="text-sm font-semibold text-emerald-300" x-text="todayScore() != null ? scoreText(todayScore()) : 'No data yet'"></div>
        </div>
    </div>

    <!-- Loading / Error -->
    <template x-if="loading && !days.length">
        <div class="p-12 text-center text-gray-500 font-mono text-sm">
            <svg class="w-8 h-8 mx-auto mb-3 animate-spin text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Loading mood calendar…
        </div>
    </template>

    <template x-if="error && !days.length">
        <div class="p-6 text-center bg-red-900/20 rounded-2xl border border-red-500/30 text-red-400 font-mono text-sm">
            <span x-text="error"></span>
            <button @click="fetchCalendar()" class="ml-3 underline hover:text-red-300">retry</button>
        </div>
    </template>

    <!-- Calendar Grid -->
    <template x-if="days.length > 0">
        <div>
            <div class="flex items-center justify-between mb-4">
                <span class="text-xs font-mono text-gray-500" x-text="days[0]?.date + ' → ' + days[days.length - 1]?.date"></span>
                <div class="flex items-center gap-3 text-[10px] font-mono text-gray-500">
                    <span class="flex items-center gap-1"><span class="inline-block w-3 h-3 rounded" style="background: hsl(120 72% 54%)"></span>Calm (0)</span>
                    <span class="flex items-center gap-1"><span class="inline-block w-3 h-3 rounded" style="background: hsl(48 72% 44%)"></span>Mild (45)</span>
                    <span class="flex items-center gap-1"><span class="inline-block w-3 h-3 rounded" style="background: hsl(0 72% 38%)"></span>Severe (100)</span>
                </div>
            </div>

            <div class="space-y-4">
                <template x-for="slot in slotConfig" :key="slot.id">
                    <div>
                        <div class="flex items-center gap-2 mb-2">
                            <span class="w-2 h-2 rounded-full bg-emerald-500/60"></span>
                            <span class="text-xs font-mono text-gray-400 uppercase tracking-wider" x-text="slot.label + '  ' + slot.time"></span>
                        </div>
                        <div class="grid gap-2" style="grid-template-columns: repeat(9, minmax(0, 1fr));">
                            <template x-for="d in days" :key="d.date + slot.id">
                                <div x-data="{ ci: null }" x-effect="ci = checkinFor(d, slot.id)">
                                    <div :class="ci ? 'text-white shadow-lg' : (isToday(d) ? 'border border-dashed border-emerald-500/40' : 'bg-space-900/60 border border-space-border/40')"
                                         :style="ci ? styleFor(ci) : ''"
                                         class="rounded-xl p-2 h-[68px] flex flex-col justify-between relative overflow-hidden cursor-default group"
                                         :title="ci ? `${ci.date} ${ci.slot} score ${ci.score}: ${ci.activity || ''}` : `${d.date} ${slot.label} — no reply`">
                                        <span class="text-[10px] font-mono block truncate" :class="ci ? 'text-white/90' : (isToday(d) ? 'text-emerald-400' : 'text-gray-600')" x-text="formatDay(d)"></span>
                                        <template x-if="ci">
                                            <div class="text-center mt-0.5">
                                                <span class="text-lg font-bold text-white drop-shadow" x-text="ci.score"></span>
                                                <span class="block text-[9px] font-mono text-white/70 leading-tight truncate mt-0.5" x-text="ci.activity || ''" :title="ci.activity"></span>
                                            </div>
                                        </template>
                                        <template x-if="!ci && isToday(d)">
                                            <span class="text-[9px] font-mono text-emerald-500/60 text-center mt-1 block">pending</span>
                                        </template>
                                        <template x-if="!ci && !isToday(d)">
                                            <span class="text-[9px] font-mono text-gray-700 text-center mt-1 block">—</span>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Most recent reply detail -->
            <div class="mt-8 p-4 rounded-2xl bg-space-900/70 border border-space-border/50" x-data="{ latest: null }" x-effect="latest = (days.flatMap(d => d.checkins || []).sort((a,b) => new Date(b.received_at) - new Date(a.received_at))[0]) || null">
                <template x-if="latest">
                    <div>
                        <div class="flex items-center gap-2 mb-2 text-xs font-mono text-gray-500 uppercase tracking-wider">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            Latest Reply
                        </div>
                        <div class="flex flex-wrap items-start gap-4">
                            <div class="flex-1 min-w-0">
                                <p class="text-white text-sm leading-relaxed" x-text="latest.activity || '(no activity text)'"></p>
                                <p class="text-[11px] text-gray-500 font-mono mt-1" x-text="latest.date + ' ' + latest.slot + ' via sms'"></p>
                            </div>
                            <div class="flex flex-col items-end gap-1 flex-shrink-0">
                                <span class="text-2xl font-bold" :style="`color: ${scoreColor(latest.score)}`" x-text="latest.score + '/100'"></span>
                                <span class="text-[10px] font-mono" :style="`color: ${scoreColor(latest.score)}`" x-text="scoreText(latest.score)"></span>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </template>
</div>
